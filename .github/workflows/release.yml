name: Release

# On a vX.Y.Z tag: test the tagged tree, build the server image for linux/amd64 and linux/arm64
# (dependency stage first, keyed on its inputs and reused) and the login image (Dockerfile.login,
# linux/amd64), smoke-test both, then tag them X.Y.Z and latest in
# ghcr.io/<owner>/google-photos-mcp and ghcr.io/<owner>/google-photos-mcp-login, and publish a
# GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# GitHub can deliver one tag push twice: the runs of a ref queue one behind the other, and a
# run whose tag already has a GitHub release (the last job) stops at `released`.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  released:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      done: ${{ steps.check.outputs.done }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          done=false
          if [ "$GITHUB_REF_TYPE" = tag ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            done=true
            echo "$TAG is already released: nothing to do"
          fi
          echo "done=$done" >> "$GITHUB_OUTPUT"

  test:
    needs: released
    if: needs.released.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: make check

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/google-photos-mcp
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, smoke-test, tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          deps="$IMAGE:deps-$(sha256sum Dockerfile.deps requirements-runtime.lock | sha256sum | cut -c1-16)"
          if ! docker buildx imagetools inspect "$deps" >/dev/null 2>&1; then
            docker buildx build --platform "$PLATFORMS" -f Dockerfile.deps -t "$deps" --push .
          fi
          candidate="$IMAGE:sha-$(git rev-parse --short=12 HEAD)"
          docker buildx build --platform "$PLATFORMS" -f Dockerfile --push -t "$candidate" \
            --build-arg PHOTOS_MCP_DEPS_IMAGE="$deps" \
            --build-arg VERSION="$version" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(git show -s --format=%cI HEAD)" \
            --build-arg SOURCE_URL="https://github.com/$GITHUB_REPOSITORY" .
          candidate_digest="$(docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' | jq -er .digest)"
          bash scripts/check-image-labels.sh "$IMAGE@$candidate_digest" "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA" "$version"
          # Smoke: HTTP refuses to start without a bearer; stdio answers initialize.
          rc=0
          docker run --rm --network none -e GOOGLE_PHOTOS_EXPECTED_EMAIL=smoke@example.com "$candidate" || rc=$?
          [ "$rc" = 1 ] || { echo "expected a refusal without MCP_BEARER_TOKEN, got exit $rc" >&2; exit 1; }
          reply="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}' \
            | timeout 60 docker run --rm -i --network none --read-only --tmpfs /state:uid=1000 \
                -e GOOGLE_PHOTOS_EXPECTED_EMAIL=smoke@example.com "$candidate" --transport stdio)"
          grep -q '"serverInfo"' <<<"$reply" || { echo "stdio initialize failed" >&2; exit 1; }
          docker buildx imagetools create -t "$IMAGE:$version" -t "$IMAGE:latest" "$candidate"

  login-image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/google-photos-mcp-login
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, smoke-test, tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          candidate="$IMAGE:sha-$(git rev-parse --short=12 HEAD)"
          docker buildx build --platform linux/amd64 -f Dockerfile.login --push -t "$candidate" \
            --build-arg VERSION="$version" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(git show -s --format=%cI HEAD)" \
            --build-arg SOURCE_URL="https://github.com/$GITHUB_REPOSITORY" .
          candidate_digest="$(docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' | jq -er .digest)"
          bash scripts/check-image-labels.sh "$IMAGE@$candidate_digest" "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA" "$version"
          docker pull -q "$candidate" >/dev/null
          # Smoke: everything the windows need is there, it refuses to start without its bearer, never as root.
          docker run --rm --network none --entrypoint sh "$candidate" -c '
            set -e
            [ "$(id -u)" = 1000 ]
            python -c "import photos_login.app, photos_login.windows, photos_login.window, photos_login.keeper, signin_window.service, patchright"
            command -v Xvfb >/dev/null && command -v x11vnc >/dev/null
            [ -f /opt/novnc/vnc.html ] && [ -f /opt/novnc/core/rfb.js ]'
          rc=0
          timeout 60 docker run --rm --network none "$candidate" || rc=$?
          [ "$rc" = 1 ] || { echo "expected a refusal without PHOTOS_LOGIN_TOKEN, got exit $rc" >&2; exit 1; }
          # End to end, offline, with a stand-in page instead of Google's (scripts/login_e2e.py).
          timeout 300 docker run --rm --network none -v "$PWD/scripts/login_e2e.py:/tmp/login_e2e.py:ro" \
            --entrypoint python "$candidate" /tmp/login_e2e.py
          bash scripts/check-maintenance-image.sh "$candidate"
          docker buildx imagetools create -t "$IMAGE:$version" -t "$IMAGE:latest" "$candidate"

  github-release:
    needs: [image, login-image]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
