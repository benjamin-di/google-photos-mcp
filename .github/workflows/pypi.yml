name: PyPI
# A vX.Y.Z tag builds the wheel and sdist from the tagged tree and uploads them to PyPI as
# `google-photos-mcp` with trusted publishing (OIDC through the `pypi` environment; no token is
# stored). Tag pushes upload once the repository variable PYPI_PUBLISH is `true`; until then,
# or to retry, run it by hand on the tag: `gh workflow run pypi.yml --ref vX.Y.Z`. Files that
# are already on PyPI are skipped, so a repeated run is harmless.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_type == 'tag' && (github.event_name == 'workflow_dispatch' || vars.PYPI_PUBLISH == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Build
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "tag $GITHUB_REF_NAME is not version $version" >&2; exit 1; }
          uv build
      - name: Upload
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
